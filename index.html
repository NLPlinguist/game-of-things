    height: min(86vw, 480px);
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.7s cubic-bezier(0.4, 0.0, 0.2, 1);
    cursor: pointer;
  }
  .card.flipped { transform: rotateY(180deg); }

  .card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px;
    box-shadow: 0 18px 45px rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.08);
  }
  .card-front { background: var(--card-front); transform: rotateY(0deg); }
  .card-back { background: var(--card-back); transform: rotateY(180deg); }

  .card-front .icon { font-size: 3.4rem; margin-bottom: 14px; }
  .card-front .title { font-size: 1.4rem; font-weight: 800; letter-spacing: 2px; }
  .card-front .tap { margin-top: 10px; font-size: 0.9rem; opacity: 0.85; letter-spacing: 1px; }

  .card-back .label {
    font-size: 0.72rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    opacity: 0.6;
    margin-bottom: 16px;
  }
  .card-back .prompt {
    font-size: clamp(1.2rem, 3.2vw, 1.6rem);
    line-height: 1.5;
    text-align: center;
    font-weight: 600;
  }

  .controls { margin-top: 26px; display: flex; gap: 12px; }
  button {
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.28);
    color: #fff;
    padding: 12px 26px;
    border-radius: 12px;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: rgba(255, 255, 255, 0.24); }
  .hint { margin-top: 10px; font-size: 0.8rem; opacity: 0.55; text-align: center; }
  .counter { margin-top: 6px; font-size: 0.8rem; opacity: 0.5; text-align: center; }

let bag = [];
let drawn = 0;
let animating = false;

const card = document.getElementById("card");
const promptEl = document.getElementById("prompt");
const counter = document.getElementById("counter");
const nextBtn = document.getElementById("nextBtn");

function refill() {
  bag = prompts.slice();
  for (let i = bag.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = bag[i];
    bag[i] = bag[j];
    bag[j] = tmp;
  }
}

function nextPrompt() {
  if (bag.length === 0) refill();
  return bag.pop();
}

function drawCard() {
  promptEl.textContent = nextPrompt();
  drawn++;
  counter.textContent = "Card #" + drawn;
}

drawCard();

function advance() {
  if (animating) return;
  if (!card.classList.contains("flipped")) {
    card.classList.add("flipped");
    return;
  }
  animating = true;
  card.classList.remove("flipped");
  setTimeout(() => {
    drawCard();
    card.classList.add("flipped");
    setTimeout(() => { animating = false; }, 400);
  }, 380);
}

nextBtn.addEventListener("click", advance);
card.addEventListener("click", advance);

let startX = 0;
let started = false;
card.addEventListener("touchstart", e => {
  startX = e.touches[0].clientX;
  started = true;
}, { passive: true });
card.addEventListener("touchend", e => {
  if (!started) return;
  started = false;
  const dx = e.changedTouches[0].clientX - startX;
  if (Math.abs(dx) > 60) advance();
});

document.addEventListener("keydown", e => {
  if (e.key === " " || e.key === "ArrowRight" || e.key === "ArrowLeft") {
    e.preventDefault();
    advance();
  }
});
