    transform-style: preserve-3d;
    transition: transform 0.7s cubic-bezier(0.4, 0.0, 0.2, 1);
    cursor: pointer;
  }
  .card.flipped { transform: rotateY(180deg); }

  .card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px;
    box-shadow: 0 18px 45px rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.08);
  }
  .card-front { background: var(--card-front); transform: rotateY(0deg); }
  .card-back { background: var(--card-back); transform: rotateY(180deg); }

  .card-front .icon { font-size: 3.4rem; margin-bottom: 14px; }
  .card-front .title { font-size: 1.4rem; font-weight: 800; letter-spacing: 2px; }

    padding: 12px 26px;
    border-radius: 12px;

    cursor: pointer;
    transition: background 0.2s;

  .hint { margin-top: 10px; font-size: 0.8rem; opacity: 0.55; text-align: center; }
  .counter { margin-top: 6px; font-size: 0.8rem; opacity: 0.5; text-align: center; }

let bag = [];
let drawn = 0;
let animating = false;
let isRevealed = false;

const card = document.getElementById("card");
const promptEl = document.getElementById("prompt");
const counter = document.getElementById("counter");
const nextBtn = document.getElementById("nextBtn");

function refill() {
  bag = prompts.slice();
  for (let i = bag.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = bag[i];
    bag[i] = bag[j];
    bag[j] = tmp;
  }
}

function nextPrompt() {
  if (bag.length === 0) refill();
  return bag.pop();
}

function setPrompt(text) {
  promptEl.textContent = text;
  drawn++;
  counter.textContent = "Card #" + drawn;
}

setPrompt(nextPrompt());

function advance() {
  if (animating) return;

  // First tap: flip the cover over to reveal the clue (directional flip).
  if (!isRevealed) {
    card.classList.add("flipped");
    isRevealed = true;
    return;
  }

  // Subsequent taps: old clue swipes off to the left, new clue slides in from the right.
  animating = true;
  const newText = nextPrompt();
  drawn++;
  counter.textContent = "Card #" + drawn;

  // Fly the current (old) card out to the left, still showing the old clue.
  const out = card.animate(
    [
      { transform: "rotateY(180deg) translateX(0%)", opacity: 1 },
      { transform: "rotateY(180deg) translateX(-150%)", opacity: 0 }
    ],
    { duration: 340, easing: "ease-in", fill: "forwards" }
  );

  out.onfinish = () => {
    // Release the out-animation so it doesn't hold the transform, then reset
    // the card to the starting position for the in-animation (offscreen right).
    out.cancel();
    promptEl.textContent = newText;
    card.style.transition = "none";
    card.style.transform = "rotateY(180deg) translateX(150%)";
    card.style.opacity = "0";

    const inn = card.animate(
      [
        { transform: "rotateY(180deg) translateX(150%)", opacity: 0 },
        { transform: "rotateY(180deg) translateX(0%)", opacity: 1 }
      ],
      { duration: 380, easing: "ease-out", fill: "forwards" }
    );
    inn.onfinish = () => {
      // Rest at base state (CSS .flipped = rotateY(180deg), opacity 1, translateX 0).
      inn.cancel();
      card.style.transition = "";
      card.style.transform = "";
      card.style.opacity = "";
      animating = false;
    };
  };
}

nextBtn.addEventListener("click", advance);
card.addEventListener("click", advance);

let startX = 0;
let started = false;
card.addEventListener("touchstart", e => {
  startX = e.touches[0].clientX;
  started = true;
}, { passive: true });
card.addEventListener("touchend", e => {
  if (!started) return;
  started = false;
  const dx = e.changedTouches[0].clientX - startX;
  if (Math.abs(dx) > 60) advance();
});

document.addEventListener("keydown", e => {
  if (e.key === " " || e.key === "ArrowRight" || e.key === "ArrowLeft") {
    e.preventDefault();
    advance();
  }
});
